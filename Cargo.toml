[package]
name = "commit-screensaver"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Omarchy screensaver that replays random Git commits with gitlogue's editor animation"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
ctrlc = { version = "3.5", features = ["termination"] }
fastrand = "2.5"
# The fork exposes gitlogue's UI as a library, with an input hook and a
# constructor that leaves signal handling to the embedding program.
gitlogue = { git = "https://github.com/igouss/gitlogue", branch = "embed" }
rustix = { version = "1.1", features = ["process"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"

[dev-dependencies]
proptest = "1.11"
tempfile = "3.27"

# Whole-program optimisation: one codegen unit, fat LTO across all crates, no
# unwinding tables, no symbols. Built for the CPU it runs on via
# .cargo/config.toml.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

# Strict: every group but restriction, plus the restriction lints worth having.
# Build with `cargo clippy --all-targets -- -D warnings`.
[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
